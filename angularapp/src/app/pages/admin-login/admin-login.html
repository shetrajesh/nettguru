
<div class="login-page">
  <header class="login-header">
    <div class="header-content">
      <a routerLink="/home" class="brand">
        <span class="brand-logo">N</span>
        <span class="brand-name">Nett<span>Guru</span></span>
      </a>

      <a routerLink="/home" class="back-home">← Back to home</a>
    </div>
  </header>

  <main class="login-main">
    <section class="login-card">

      <ng-container *ngIf="currentView === 'login'; else forgotPassword">
        <h1>Login</h1>
        <p class="login-subtitle">
          Sign in to your NettGuru account.
        </p>

        <form (ngSubmit)="login()">
          <div class="form-group">
            <label for="username">User ID</label>
            <input
              id="username"
              type="email"
              name="username"
              [(ngModel)]="username"
              (ngModelChange)="clearLoginError()"
              [class.invalid]="credentialsInvalid"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                name="password"
                [(ngModel)]="password"
                (ngModelChange)="clearLoginError()"
                [class.invalid]="credentialsInvalid"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="show-password"
                (click)="showPassword = !showPassword">
                {{ showPassword ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>

          <p *ngIf="loginMessage" class="error" role="alert">
            {{ loginMessage }}
          </p>

          <button
            type="submit"
            class="sign-in-button"
            [disabled]="isLoading">
            {{ isLoading ? 'Signing in...' : 'Sign in' }}
          </button>
        </form>

        <button
          type="button"
          class="text-link forgot-link"
          (click)="showForgotPassword()">
          Forgot password?
        </button>
      </ng-container>

      <ng-template #forgotPassword>
        <h1>Forgot password?</h1>
        <p class="login-subtitle">
          Enter your email address to get help recovering your account.
        </p>

        <form (ngSubmit)="continueForgotPassword()">
          <div class="form-group">
            <label for="recovery-email">Email address</label>
            <input
              id="recovery-email"
              type="email"
              name="email"
              [(ngModel)]="email"
              (ngModelChange)="clearForgotMessage()"
              autocomplete="email"
              required
            />
          </div>

          <p *ngIf="forgotMessage" class="error" role="alert">
            {{ forgotMessage }}
          </p>

          <button type="submit" class="sign-in-button">
            Continue
          </button>
        </form>

        <button
          type="button"
          class="text-link forgot-link"
          (click)="backToLogin()">
          Back to login
        </button>
      </ng-template>

      <div class="support-info">
        <p>
          Need help? Email
          <a href="mailto:info@nettguru.com">info@nettguru.com</a>
          or call
          <a href="tel:+16692872102">+1 669-287-2102</a>.
        </p>
      </div>

    </section>
  </main>
</div>
