
<div class="dashboard-layout">
  <main class="dashboard-main">
    <header class="dashboard-header">
      <div class="page-heading">
        <span class="eyebrow">OVERVIEW</span>
        <h1>Team Dashboard</h1>
        <p>Welcome to your NettGuru Office team dashboard.</p>
      </div>

      <button
        type="button"
        class="sign-out-button"
        (click)="signOut()">
        Sign Out
      </button>
    </header>

    <section class="stats-grid">
      <article class="stat-card">
        <p class="stat-title">Total Clients</p>
        <h2>{{ totalClients }}</h2>
        <p class="stat-description">Registered clients</p>
      </article>

      <article class="stat-card">
        <p class="stat-title">Pending Invitations</p>
        <h2>{{ pendingInvitations }}</h2>
        <p class="stat-description">Awaiting registration</p>
      </article>
    </section>
  </main>
</div>
